# Publishes the site to GitHub Pages from main, once the pages it is built from pass
# their checks, with the versions in constraints.txt.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One at a time, in the order pushed: a run waiting behind another is replaced by a
# newer one, so the commit published last is the newest. A deployment under way is
# left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: python -m pip install -c constraints.txt -e ".[site]"

      - name: Check the docs layout
        run: python -m classroom_runbooks.structure

      - name: Check the room inventory and its pages
        run: python -m classroom_runbooks.inventory --check

      - name: Validate the runbooks, coverage and links
        run: python -m classroom_runbooks.validate

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # A deployment fails on a repository with Pages turned off, as a fork's usually is;
    # there the run stops at a checked build.
    if: github.event.repository.has_pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
