# Every kind of equipment a classroom can have. `category` is the runbook category
# (a prefix in structure.toml) a room's page files it under; runbooks in other
# categories may cover it too. `kind` groups it within the category. Room pages list
# a room's equipment in this file's order.

# Audio-visual: projection
[[equipment]]
id = "laser-projector"
name = "Laser projector"
category = "AV"
kind = "projector"

[[equipment]]
id = "short-throw-projector"
name = "Short-throw projector"
category = "AV"
kind = "projector"

[[equipment]]
id = "projection-screen"
name = "Motorized projection screen"
category = "AV"
kind = "projector"

