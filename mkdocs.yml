# The site: `mkdocs build --strict` writes it to site/ and fails on any warning (a
# link or #anchor that reaches nothing, a page left out of the navigation). Not with
# -q, which hides the warnings and so lets the build pass.
# The navigation is not written here: src/classroom_runbooks/site.py makes it from
# structure.toml, and gives headings the anchors the validator checks links against.

site_name: Classroom IT Runbooks
site_description: Runbooks, a room inventory and support procedures for classroom technology
# A project site is served under the repository's name. Without this the built 404 page,
# which can be shown at any depth, loads its assets from /assets/, which is not there.
site_url: https://purusaluja.github.io/classroom-it-runbooks/
# The theme shows the repository's latest release and star and fork counts beside
# this link, which each visitor's browser asks GitHub's API for.
repo_url: https://github.com/PuruSaluja/classroom-it-runbooks
repo_name: classroom-it-runbooks
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

hooks:
  - src/classroom_runbooks/site.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  # System fonts, so no fonts are loaded from Google.
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search

# The knowledge-base export's extensions, and none GitHub lacks, so a page uses no
# syntax one of the three does not render.
markdown_extensions:
  - tables
  - fenced_code
  - sane_lists
  - toc:
      permalink: true
